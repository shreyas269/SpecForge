<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 590" font-family="'Times New Roman', 'CMU Serif', Georgia, serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" fill="#333">
      <polygon points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>

  <rect width="1020" height="590" fill="white"/>

  <!-- Title -->
  <text x="220" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">DFlash Training</text>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- LEFT SIDE: Pipeline                                  -->
  <!-- ════════════════════════════════════════════════════ -->

  <!-- Training Text -->
  <text x="220" y="64" text-anchor="middle" font-size="12" fill="#333" font-style="italic">"The quick brown fox jumps over the lazy dog ..."</text>
  <line x1="220" y1="72" x2="220" y2="96" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Target Model -->
  <rect x="148" y="98" width="144" height="40" rx="6" fill="#FFE0E0" stroke="#CC4444" stroke-width="1.2"/>
  <text x="220" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Target Model</text>
  <text x="220" y="130" text-anchor="middle" font-size="9" fill="#AA4444" font-style="italic">frozen</text>

  <!-- Arrow down -->
  <line x1="220" y1="138" x2="220" y2="162" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Fused Target Context Feature -->
  <rect x="108" y="164" width="224" height="36" rx="5" fill="#CCE0FF" stroke="#4477CC" stroke-width="1.2"/>
  <text x="220" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#335599">Fused Target Context Feature</text>

  <!-- ════════ KV INJECTION ARROW (left side bypass) ════════ -->
  <path d="M 108 182 L 80 182 L 80 423 L 108 423" stroke="#4477CC" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="64" y="310" text-anchor="middle" font-size="9" fill="#4477CC" font-weight="bold" transform="rotate(-90, 64, 310)">KV injection</text>

  <!-- ════════ ANCHOR + NOISE BLOCKS ════════ -->
  <text x="240" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">Sample Anchors &amp; Build Noise Blocks</text>

  <!-- Visual blocks -->
  <g transform="translate(108, 246)">
    <!-- Block 1 -->
    <rect x="0" y="0" width="30" height="24" fill="#FFD700" stroke="#CC9900" stroke-width="0.8"/>
    <text x="15" y="16" text-anchor="middle" font-size="9" fill="#664400">r<tspan font-size="6" dy="1">1</tspan></text>
    <rect x="30" y="0" width="30" height="24" fill="#C8F0C8" stroke="#66AA66" stroke-width="0.8"/>
    <text x="45" y="16" text-anchor="middle" font-size="8" fill="#336633">&lt;m&gt;</text>
    <rect x="60" y="0" width="30" height="24" fill="#C8F0C8" stroke="#66AA66" stroke-width="0.8"/>
    <text x="75" y="16" text-anchor="middle" font-size="8" fill="#336633">&lt;m&gt;</text>
    <rect x="90" y="0" width="30" height="24" fill="#C8F0C8" stroke="#66AA66" stroke-width="0.8"/>
    <text x="105" y="16" text-anchor="middle" font-size="8" fill="#336633">&lt;m&gt;</text>

    <!-- Block 2 -->
    <rect x="140" y="0" width="30" height="24" fill="#FFD700" stroke="#CC9900" stroke-width="0.8"/>
    <text x="155" y="16" text-anchor="middle" font-size="9" fill="#664400">r<tspan font-size="6" dy="1">4</tspan></text>
    <rect x="170" y="0" width="30" height="24" fill="#C8F0C8" stroke="#66AA66" stroke-width="0.8"/>
    <text x="185" y="16" text-anchor="middle" font-size="8" fill="#336633">&lt;m&gt;</text>
    <rect x="200" y="0" width="30" height="24" fill="#C8F0C8" stroke="#66AA66" stroke-width="0.8"/>
    <text x="215" y="16" text-anchor="middle" font-size="8" fill="#336633">&lt;m&gt;</text>
    <rect x="230" y="0" width="30" height="24" fill="#C8F0C8" stroke="#66AA66" stroke-width="0.8"/>
    <text x="245" y="16" text-anchor="middle" font-size="8" fill="#336633">&lt;m&gt;</text>

    <text x="274" y="16" font-size="14" fill="#888">...</text>

    <text x="60" y="40" text-anchor="middle" font-size="8" fill="#888">Block 1</text>
    <text x="200" y="40" text-anchor="middle" font-size="8" fill="#888">Block 2</text>
  </g>

  <!-- Arrow down to Target Embedding -->
  <line x1="220" y1="294" x2="220" y2="318" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Target Embedding -->
  <rect x="128" y="320" width="184" height="34" rx="5" fill="#FFE0E0" stroke="#CC4444" stroke-width="1.2"/>
  <text x="220" y="342" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Target Embedding</text>
  <text x="220" y="350" text-anchor="middle" font-size="8" fill="#AA4444" font-style="italic">frozen</text>

  <!-- Arrow down -->
  <line x1="220" y1="354" x2="220" y2="398" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Draft Model -->
  <rect x="108" y="400" width="224" height="46" rx="7" fill="#E8F8E8" stroke="#44AA44" stroke-width="1.6"/>
  <text x="220" y="422" text-anchor="middle" font-size="14" font-weight="bold" fill="#226622">Draft Model</text>
  <text x="220" y="438" text-anchor="middle" font-size="9" fill="#44AA44" font-style="italic">trainable  |  N blocks in parallel</text>

  <!-- Arrow down -->
  <line x1="220" y1="446" x2="220" y2="470" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Target LM Head -->
  <rect x="138" y="472" width="164" height="34" rx="5" fill="#FFE0E0" stroke="#CC4444" stroke-width="1.2"/>
  <text x="220" y="488" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Target LM Head</text>
  <text x="220" y="500" text-anchor="middle" font-size="8" fill="#AA4444" font-style="italic">frozen</text>

  <!-- Arrow down -->
  <line x1="220" y1="506" x2="220" y2="530" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Loss -->
  <rect x="148" y="532" width="144" height="30" rx="6" fill="#FFE8F0" stroke="#CC6688" stroke-width="1.2"/>
  <text x="220" y="552" text-anchor="middle" font-size="12" font-weight="bold" fill="#993355">Cross-Entropy Loss</text>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- RIGHT SIDE: Attention Pattern (Fig 4 style)          -->
  <!-- Rows = Q (block tokens), Columns = KV (context+blocks) -->
  <!-- ════════════════════════════════════════════════════ -->
  <g transform="translate(490, 48)">
    <text x="210" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Training Attention Pattern</text>

    <!-- Column headers (KV positions) -->
    <text x="80" y="32" text-anchor="middle" font-size="10" fill="#4477CC" font-weight="bold">From Target</text>
    <text x="80" y="44" text-anchor="middle" font-size="10" fill="#4477CC" font-weight="bold">Model</text>
    <text x="242" y="38" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">Block 1</text>
    <text x="320" y="38" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">Block 2</text>

    <!-- Column sub-labels (KV token names) -->
    <g transform="translate(2, 48)">
      <text x="13" y="10" text-anchor="middle" font-size="7" fill="#4477CC">p<tspan font-size="5" dy="1">1</tspan></text>
      <text x="39" y="10" text-anchor="middle" font-size="7" fill="#4477CC">p<tspan font-size="5" dy="1">2</tspan></text>
      <text x="65" y="10" text-anchor="middle" font-size="7" fill="#4477CC">r<tspan font-size="5" dy="1">1</tspan></text>
      <text x="91" y="10" text-anchor="middle" font-size="7" fill="#4477CC">r<tspan font-size="5" dy="1">2</tspan></text>
      <text x="117" y="10" text-anchor="middle" font-size="7" fill="#4477CC">r<tspan font-size="5" dy="1">3</tspan></text>
      <text x="143" y="10" text-anchor="middle" font-size="7" fill="#4477CC">r<tspan font-size="5" dy="1">4</tspan></text>
      <!-- gap -->
      <text x="214" y="10" text-anchor="middle" font-size="7" fill="#664400">r<tspan font-size="5" dy="1">1</tspan></text>
      <text x="240" y="10" text-anchor="middle" font-size="7" fill="#336633">&lt;m&gt;</text>
      <text x="266" y="10" text-anchor="middle" font-size="7" fill="#336633">&lt;m&gt;</text>
      <!-- gap -->
      <text x="306" y="10" text-anchor="middle" font-size="7" fill="#664400">r<tspan font-size="5" dy="1">4</tspan></text>
      <text x="332" y="10" text-anchor="middle" font-size="7" fill="#336633">&lt;m&gt;</text>
      <text x="358" y="10" text-anchor="middle" font-size="7" fill="#336633">&lt;m&gt;</text>
    </g>

    <!-- Row labels (Q positions = block tokens) -->
    <!-- Block 1 Q tokens -->
    <text x="-4" y="80" text-anchor="end" font-size="9" fill="#664400">r<tspan font-size="7" dy="1">1</tspan></text>
    <text x="-4" y="106" text-anchor="end" font-size="9" fill="#336633">&lt;m&gt;</text>
    <text x="-4" y="132" text-anchor="end" font-size="9" fill="#336633">&lt;m&gt;</text>
    <!-- Block 2 Q tokens -->
    <text x="-4" y="170" text-anchor="end" font-size="9" fill="#664400">r<tspan font-size="7" dy="1">4</tspan></text>
    <text x="-4" y="196" text-anchor="end" font-size="9" fill="#336633">&lt;m&gt;</text>
    <text x="-4" y="222" text-anchor="end" font-size="9" fill="#336633">&lt;m&gt;</text>

    <!-- Row group labels -->
    <text x="-26" y="106" text-anchor="middle" font-size="8" fill="#888" transform="rotate(-90, -26, 106)">Block 1</text>
    <text x="-26" y="196" text-anchor="middle" font-size="8" fill="#888" transform="rotate(-90, -26, 196)">Block 2</text>

    <!-- Cell size = 26x26, grid starts at (2, 62) -->
    <g transform="translate(2, 62)">
      <!-- ═══ BLOCK 1 Q ROWS (3 rows) ═══ -->
      <!-- Block 1 anchor = r1. Causal: sees p1, p2 (strict < r1). -->

      <!-- Row 0 (r1 Q): context columns -->
      <rect x="0" y="0" width="26" height="26" fill="#CCE0FF" stroke="#99BBD8" stroke-width="0.6"/>
      <rect x="26" y="0" width="26" height="26" fill="#CCE0FF" stroke="#99BBD8" stroke-width="0.6"/>
      <rect x="52" y="0" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="78" y="0" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="104" y="0" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="130" y="0" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <!-- Block 1 KV: bidirectional -->
      <rect x="200" y="0" width="26" height="26" fill="#FFD700" stroke="#CC9900" stroke-width="0.6"/>
      <rect x="226" y="0" width="26" height="26" fill="#C8F0C8" stroke="#66AA66" stroke-width="0.6"/>
      <rect x="252" y="0" width="26" height="26" fill="#C8F0C8" stroke="#66AA66" stroke-width="0.6"/>
      <!-- Block 2 KV: invisible -->
      <rect x="292" y="0" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="318" y="0" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="344" y="0" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>

      <!-- Row 1 (<m> Q): same pattern -->
      <rect x="0" y="26" width="26" height="26" fill="#CCE0FF" stroke="#99BBD8" stroke-width="0.6"/>
      <rect x="26" y="26" width="26" height="26" fill="#CCE0FF" stroke="#99BBD8" stroke-width="0.6"/>
      <rect x="52" y="26" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="78" y="26" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="104" y="26" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="130" y="26" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="200" y="26" width="26" height="26" fill="#FFD700" stroke="#CC9900" stroke-width="0.6"/>
      <rect x="226" y="26" width="26" height="26" fill="#C8F0C8" stroke="#66AA66" stroke-width="0.6"/>
      <rect x="252" y="26" width="26" height="26" fill="#C8F0C8" stroke="#66AA66" stroke-width="0.6"/>
      <rect x="292" y="26" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="318" y="26" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="344" y="26" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>

      <!-- Row 2 (<m> Q): same pattern -->
      <rect x="0" y="52" width="26" height="26" fill="#CCE0FF" stroke="#99BBD8" stroke-width="0.6"/>
      <rect x="26" y="52" width="26" height="26" fill="#CCE0FF" stroke="#99BBD8" stroke-width="0.6"/>
      <rect x="52" y="52" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="78" y="52" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="104" y="52" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="130" y="52" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="200" y="52" width="26" height="26" fill="#FFD700" stroke="#CC9900" stroke-width="0.6"/>
      <rect x="226" y="52" width="26" height="26" fill="#C8F0C8" stroke="#66AA66" stroke-width="0.6"/>
      <rect x="252" y="52" width="26" height="26" fill="#C8F0C8" stroke="#66AA66" stroke-width="0.6"/>
      <rect x="292" y="52" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="318" y="52" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="344" y="52" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>

      <!-- ═══ Gap between block groups ═══ -->

      <!-- ═══ BLOCK 2 Q ROWS (3 rows, starting at y=90) ═══ -->
      <!-- Block 2 anchor = r4. Causal: sees p1, p2, r1, r2, r3 (strict < r4). -->

      <!-- Row 3 (r4 Q): context columns -->
      <rect x="0" y="90" width="26" height="26" fill="#CCE0FF" stroke="#99BBD8" stroke-width="0.6"/>
      <rect x="26" y="90" width="26" height="26" fill="#CCE0FF" stroke="#99BBD8" stroke-width="0.6"/>
      <rect x="52" y="90" width="26" height="26" fill="#CCE0FF" stroke="#99BBD8" stroke-width="0.6"/>
      <rect x="78" y="90" width="26" height="26" fill="#CCE0FF" stroke="#99BBD8" stroke-width="0.6"/>
      <rect x="104" y="90" width="26" height="26" fill="#CCE0FF" stroke="#99BBD8" stroke-width="0.6"/>
      <rect x="130" y="90" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <!-- Block 1 KV: invisible -->
      <rect x="200" y="90" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="226" y="90" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="252" y="90" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <!-- Block 2 KV: bidirectional -->
      <rect x="292" y="90" width="26" height="26" fill="#FFD700" stroke="#CC9900" stroke-width="0.6"/>
      <rect x="318" y="90" width="26" height="26" fill="#C8F0C8" stroke="#66AA66" stroke-width="0.6"/>
      <rect x="344" y="90" width="26" height="26" fill="#C8F0C8" stroke="#66AA66" stroke-width="0.6"/>

      <!-- Row 4 (<m> Q) -->
      <rect x="0" y="116" width="26" height="26" fill="#CCE0FF" stroke="#99BBD8" stroke-width="0.6"/>
      <rect x="26" y="116" width="26" height="26" fill="#CCE0FF" stroke="#99BBD8" stroke-width="0.6"/>
      <rect x="52" y="116" width="26" height="26" fill="#CCE0FF" stroke="#99BBD8" stroke-width="0.6"/>
      <rect x="78" y="116" width="26" height="26" fill="#CCE0FF" stroke="#99BBD8" stroke-width="0.6"/>
      <rect x="104" y="116" width="26" height="26" fill="#CCE0FF" stroke="#99BBD8" stroke-width="0.6"/>
      <rect x="130" y="116" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="200" y="116" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="226" y="116" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="252" y="116" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="292" y="116" width="26" height="26" fill="#FFD700" stroke="#CC9900" stroke-width="0.6"/>
      <rect x="318" y="116" width="26" height="26" fill="#C8F0C8" stroke="#66AA66" stroke-width="0.6"/>
      <rect x="344" y="116" width="26" height="26" fill="#C8F0C8" stroke="#66AA66" stroke-width="0.6"/>

      <!-- Row 5 (<m> Q) -->
      <rect x="0" y="142" width="26" height="26" fill="#CCE0FF" stroke="#99BBD8" stroke-width="0.6"/>
      <rect x="26" y="142" width="26" height="26" fill="#CCE0FF" stroke="#99BBD8" stroke-width="0.6"/>
      <rect x="52" y="142" width="26" height="26" fill="#CCE0FF" stroke="#99BBD8" stroke-width="0.6"/>
      <rect x="78" y="142" width="26" height="26" fill="#CCE0FF" stroke="#99BBD8" stroke-width="0.6"/>
      <rect x="104" y="142" width="26" height="26" fill="#CCE0FF" stroke="#99BBD8" stroke-width="0.6"/>
      <rect x="130" y="142" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="200" y="142" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="226" y="142" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="252" y="142" width="26" height="26" fill="white" stroke="#DDD" stroke-width="0.6"/>
      <rect x="292" y="142" width="26" height="26" fill="#FFD700" stroke="#CC9900" stroke-width="0.6"/>
      <rect x="318" y="142" width="26" height="26" fill="#C8F0C8" stroke="#66AA66" stroke-width="0.6"/>
      <rect x="344" y="142" width="26" height="26" fill="#C8F0C8" stroke="#66AA66" stroke-width="0.6"/>

    </g>

    <!-- Axis labels -->
    <text x="210" y="244" text-anchor="middle" font-size="9" fill="#999" font-style="italic">KV positions (columns) →</text>
    <text x="-38" y="140" text-anchor="middle" font-size="9" fill="#999" font-style="italic" transform="rotate(-90, -38, 140)">Q positions (rows) →</text>

    <!-- Key insight -->
    <g transform="translate(0, 260)">
      <text x="190" y="0" text-anchor="middle" font-size="10" fill="#555" font-style="italic">Context: causal (strictly before anchor)</text>
      <text x="190" y="16" text-anchor="middle" font-size="10" fill="#555" font-style="italic">Intra-block: bidirectional</text>
      <text x="190" y="32" text-anchor="middle" font-size="10" fill="#555" font-style="italic">Cross-block: invisible</text>
    </g>

    <!-- Legend (under attention pattern) -->
    <g transform="translate(20, 308)">
      <rect x="0" y="0" width="370" height="56" rx="6" fill="none" stroke="#CC6688" stroke-width="1" stroke-dasharray="5,3"/>

      <rect x="14" y="10" width="12" height="12" fill="#CCE0FF" stroke="#4477CC" stroke-width="0.8"/>
      <text x="32" y="20" font-size="9" fill="#333">Fused Target Context Feature</text>

      <rect x="196" y="10" width="12" height="12" fill="#FFD700" stroke="#CC9900" stroke-width="0.8"/>
      <text x="214" y="20" font-size="9" fill="#333">Clean Token (Anchor)</text>

      <rect x="14" y="32" width="12" height="12" fill="#C8F0C8" stroke="#66AA66" stroke-width="0.8"/>
      <text x="32" y="42" font-size="9" fill="#333">Mask Token</text>

      <rect x="196" y="32" width="12" height="12" fill="white" stroke="#CCC" stroke-width="0.8"/>
      <text x="214" y="42" font-size="9" fill="#333">Invisible Token</text>
    </g>
  </g>
</svg>